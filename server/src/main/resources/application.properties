spring.application.name=lumina-box-server
server.port=${PORT:4000}

# Same .env file the Node server used (KEY=value lines)
spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}

# Files are capped at 300 MB (avatars are checked separately in the controller)
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

app.client-origin=${CLIENT_ORIGIN:*}
app.jwt-secret=${JWT_SECRET}
app.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.b2.endpoint=${B2_ENDPOINT}
app.b2.region=${B2_REGION}
app.b2.key-id=${B2_KEY_ID}
app.b2.application-key=${B2_APPLICATION_KEY}
app.b2.bucket-name=${B2_BUCKET_NAME}
